<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Skill Tree</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Idle Skill Tree</h1>
    </header>

    <div class="main-content">
      <!-- Left Panel: Stats -->
      <aside class="stats-panel">
        <div class="stat-card">
          <h2>Level</h2>
          <div id="level" class="stat-value">1</div>
        </div>
        <div class="stat-card">
          <h2>XP</h2>
          <div id="xp" class="stat-value">0</div>
          <div class="stat-bar">
            <div id="xp-bar" class="xp-fill"></div>
          </div>
          <div id="xp-needed" class="stat-subtext">0 / 100 XP</div>
        </div>
        <div class="stat-card">
          <h2>Skill Points</h2>
          <div id="skill-points" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <h2>XP/s</h2>
          <div id="xp-per-second" class="stat-value">0</div>
        </div>
      </aside>

      <!-- Right Panel: Skill Tree -->
      <main class="skill-tree-panel">
        <div id="skill-tree" class="skill-tree">
          <!-- Nodes will be rendered here -->
        </div>
      </main>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script>
    const game = new SkillTreeGame();
    const ui = new SkillTreeUI(game);
    ui.init();
  </script>
</body>
</html>
